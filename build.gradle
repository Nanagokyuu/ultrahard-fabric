plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
	id 'maven-publish'
}

version = project.version
group = project.group

base {
	archivesName = 'ultrahard'
}

loom {
	accessWidenerPath = file("src/main/resources/ultrahard.classtweaker")
}

repositories {
	mavenCentral()
}

dependencies {
	// Minecraft 26.1 及更高版本未混淆，因此使用 implementation，不需要 mappings()。
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

def verifyMixinConfiguration = tasks.register('verifyMixinConfiguration') {
	group = 'verification'
	description = 'Validates Mixin class names and registration against source files.'
	def configurationFile = file('src/main/resources/ultrahard.mixins.json')
	def mixinSources = fileTree('src/main/java/com/nanagokyuu/ultrahard/mixin') {
		include '**/*.java'
	}
	inputs.file(configurationFile)
	inputs.files(mixinSources)
	doLast {
		def configuration = new groovy.json.JsonSlurper().parse(configurationFile)
		def registered = ['mixins', 'client', 'server'].collectMany { configuration[it] ?: [] }
		def qualifiedNames = registered.collect { name ->
			if (!(name ==~ /[A-Za-z_$][\w$]*(\.[A-Za-z_$][\w$]*)*/)) {
				throw new GradleException("Mixin must use a dotted class name: ${name}")
			}
			"${configuration['package']}.${name}".toString()
		}
		if (qualifiedNames.toSet().size() != qualifiedNames.size()) {
			throw new GradleException('Duplicate Mixin registration')
		}
		def sourceNames = mixinSources.files.collect { source ->
			def packageMatch = source.text =~ /(?m)^package\s+([\w.]+);/
			if (!packageMatch.find()) throw new GradleException("Missing package: ${source}")
			"${packageMatch.group(1)}.${source.name.replaceFirst(/\.java$/, '')}".toString()
		}.toSet()
		def missing = sourceNames - qualifiedNames.toSet()
		def unknown = qualifiedNames.toSet() - sourceNames
		if (!missing.isEmpty() || !unknown.isEmpty()) {
			throw new GradleException("Mixin registration mismatch; missing=${missing}, unknown=${unknown}")
		}
	}
}

tasks.named('processResources') {
	dependsOn verifyMixinConfiguration
}

tasks.named('check') {
	dependsOn verifyMixinConfiguration
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
	compilerOptions {
		jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25
	}
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

kotlin {
	jvmToolchain(25)
}

jar {
	def projectName = project.base.archivesName.get()
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_${projectName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
